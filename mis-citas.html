<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mis citas – EjeSalud</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>
<div class="dashboard-wrapper">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-text">Eje<span>Salud</span></div>
      <div class="sidebar-role-badge"><i class="fas fa-user me-1"></i>Paciente</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-title">Principal</div>
      <a href="dashboard-paciente.html" class="sidebar-link"><i class="fas fa-th-large"></i>Dashboard</a>
      <a href="agendar-cita.html" class="sidebar-link"><i class="fas fa-calendar-plus"></i>Agendar cita</a>
      <a href="mis-citas.html" class="sidebar-link active"><i class="fas fa-calendar-alt"></i>Mis citas</a>
      <div class="sidebar-section-title">Cuenta</div>
      <a href="#" class="sidebar-link"><i class="fas fa-user-circle"></i>Mi perfil</a>
      <a href="#" class="sidebar-link" data-action="logout"><i class="fas fa-sign-out-alt"></i>Cerrar sesión</a>
    </nav>
    <div class="sidebar-user">
      <div class="sidebar-avatar">JP</div>
      <div>
        <div class="sidebar-user-name">Juan Pérez</div>
        <div class="sidebar-user-email">juan@email.com</div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button id="sidebarToggle" class="d-md-none btn border-0 p-1">
          <i class="fas fa-bars text-primary"></i>
        </button>
        <span class="topbar-title">Mis citas</span>
      </div>
      <a href="agendar-cita.html" class="btn-primary-custom" style="font-size:.85rem">
        <i class="fas fa-plus me-1"></i>Nueva cita
      </a>
    </div>

    <div class="content-area">
      <!-- Filtros -->
      <div class="dash-card mb-4">
        <div class="d-flex flex-wrap align-items-center gap-3 justify-content-between">
          <div class="d-flex gap-2 flex-wrap">
            <button class="filter-tab btn-primary-custom active" style="font-size:.82rem;padding:7px 18px" onclick="filtrarCitas('todas')">
              Todas
            </button>
            <button class="filter-tab btn-outline-primary-custom" style="font-size:.82rem;padding:6px 18px" onclick="filtrarCitas('confirmada')">
              Confirmadas
            </button>
            <button class="filter-tab btn-outline-primary-custom" style="font-size:.82rem;padding:6px 18px" onclick="filtrarCitas('pendiente')">
              Pendientes
            </button>
            <button class="filter-tab btn-outline-primary-custom" style="font-size:.82rem;padding:6px 18px" onclick="filtrarCitas('atendida')">
              Atendidas
            </button>
            <button class="filter-tab btn-outline-primary-custom" style="font-size:.82rem;padding:6px 18px" onclick="filtrarCitas('cancelada')">
              Canceladas
            </button>
          </div>
          <select id="filterEstado" style="display:none"></select>
          <select class="form-control-custom" style="width:auto;font-size:.85rem" onchange="filtrarPorArea(this.value)">
            <option value="">Todas las áreas</option>
            <option>Medicina General</option>
            <option>Odontología</option>
            <option>Medicina Interna</option>
            <option>Radiografías</option>
            <option>Psicología</option>
          </select>
        </div>
      </div>

      <!-- Lista de citas -->
      <div id="citasPacienteList"></div>
    </div>
  </div>
</div>

<!-- Modal Mover Cita -->
<div class="modal fade modal-custom" id="moverCitaModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-calendar-alt me-2"></i>Reprogramar cita</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div class="mb-3">
          <label class="form-label-custom">Nueva fecha</label>
          <input type="date" id="nuevaFecha" class="form-control-custom future-only"/>
        </div>
        <div class="mb-3">
          <label class="form-label-custom">Nueva hora</label>
          <select id="nuevaHora" class="form-control-custom">
            <option value="">Selecciona hora…</option>
            <option>09:00</option><option>09:30</option><option>10:00</option>
            <option>10:30</option><option>11:00</option><option>11:30</option>
            <option>12:00</option><option>14:00</option><option>14:30</option>
            <option>15:00</option><option>15:30</option><option>16:00</option>
            <option>16:30</option><option>17:00</option>
          </select>
        </div>
        <div class="alert-info-custom">
          <i class="fas fa-info-circle me-2"></i>Recibirás confirmación por correo electrónico.
        </div>
      </div>
      <div class="modal-footer border-0 px-4 pb-4">
        <button class="btn-outline-primary-custom" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn-primary-custom" onclick="confirmarMoverCita()">
          <i class="fas fa-check me-1"></i>Confirmar cambio
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script>
// Activar el filtro visual
document.querySelectorAll('.filter-tab').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-tab').forEach(b => {
      b.className = 'filter-tab btn-outline-primary-custom';
      b.style.fontSize = '.82rem';
      b.style.padding = '6px 18px';
    });
    this.className = 'filter-tab btn-primary-custom active';
    this.style.fontSize = '.82rem';
    this.style.padding = '7px 18px';
  });
});
</script>
</body>
</html>
